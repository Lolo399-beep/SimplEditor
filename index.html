<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- VISTA PRINCIPAL (Menú de Proyectos) -->
    <div id="mainView">
        <h1>Proyectos</h1>

        <div class="grid" id="projectGrid">
            <!-- Tarjeta para crear nuevo proyecto -->
            <div class="project-card">
                <div class="project-box" id="addProjectBtn" title="Crear nuevo proyecto">
                    <span class="plus-sign">+</span>
                </div>
                <input type="text" class="project-name" value="Nuevo proyecto" readonly />
            </div>
        </div>
    </div>

    <!-- VISTA EXCLUSIVA DEL PROYECTO -->
    <div id="projectDetailView" class="hidden">
        <header class="project-header">
            <button id="backBtn" class="back-btn">← Volver</button>
            <h2 id="currentProjectTitle">Nombre del Proyecto</h2>
        </header>
        <!-- Aquí puedes agregar más contenido futuro de tu editor -->
    </div>

    <script src="main.js"></script>
</body>
</html>
