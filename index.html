<!DOCTYPE html>
<!-- ==========================================================================
     ARCHIVO: index.html
     PROPÓSITO: Estructura principal de la aplicación web (Editor de Video).
     CONEXIONES:
       - Carga 'styles.css' para toda la apariencia visual y diseño oscuro.
       - Carga 'main.js' al final para controlar la lógica, reproducción,
         recortes, efectos, persistencia en IndexedDB y exportación.
     ========================================================================== -->
<html lang="es">
<head>
    <!-- Configuración de codificación de caracteres (soporta tildes y eñes) -->
    <meta charset="UTF-8">
    <!-- Ajuste de escala para pantallas de distintos tamaños y dispositivos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Proyectos</title>
    <!-- Hoja de estilos principal de toda la interfaz -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ======================================================================
         SECCIÓN 1: VISTA PRINCIPAL (Menú / Galería de Proyectos)
         Permite crear nuevos proyectos, cambiarles el nombre, ponerles
         miniatura, buscarlos por nombre o abrirlos para editar.
         ====================================================================== -->
    <div id="mainView">
        <header class="main-header">
            <h1>Proyectos</h1>

            <!-- BARRA Y MENÚ DESPLEGABLE DE BÚSQUEDA DE PROYECTOS -->
            <div class="search-container">
                <div class="search-bar">
                    <span class="search-icon">⌕</span>
                    <!-- Campo de texto donde el usuario escribe para filtrar proyectos en tiempo real -->
                    <input type="text" id="searchInput" placeholder="Buscar" autocomplete="off" spellcheck="false">
                </div> 
                <!-- Contenedor desplegable donde main.js inyecta los resultados coincidentes -->
                <div id="searchResults" class="search-results-dropdown hidden"></div>
            </div>
        </header>

        <!-- Cuadrícula (Grid) donde se muestran las tarjetas de todos los proyectos -->
        <div class="grid" id="projectGrid">
            <!-- Tarjeta fija inicial con el símbolo '+' para crear un proyecto nuevo -->
            <div class="project-card">
                <div class="project-box" id="addProjectBtn" title="Crear nuevo proyecto">
                    <span class="plus-sign">+</span>
                </div>
                <input type="text" class="project-name" value="Nuevo proyecto" readonly />
            </div>
        </div>
    </div>

    <!-- ======================================================================
         SECCIÓN 2: VISTA EXCLUSIVA DEL PROYECTO (Editor de Video y Audio)
         Se muestra al abrir un proyecto. Contiene:
           1. Cabecera fija superior (.sticky-top) con volver, título, Undo/Redo,
              controles de reproducción y lienzo de vista previa.
           2. Área de trabajo (.project-workspace) con la línea de tiempo multipista,
              regla de segundos, cabezal rojo y botones de importar/texto/exportar.
         ====================================================================== -->
    <div id="projectDetailView" class="hidden">
        <!-- Cabecera + vista previa que permanecen visibles al hacer scroll horizontal en timelines largos -->
        <div class="sticky-top" id="stickyTop">
            <header class="project-header">
                <!-- Regresa al menú principal y guarda automáticamente el estado del proyecto -->
                <button id="backBtn" class="back-btn">&lt;- Volver</button>
                <!-- Muestra el nombre del proyecto abierto actualmente -->
                <h2 id="currentProjectTitle">Nombre del Proyecto</h2>

                <!-- Botones de historial (Deshacer y Rehacer acciones en el editor) -->
                <div class="history-controls">
                    <button id="undoBtn" class="icon-btn" title="Deshacer (Ctrl + Z)">↶</button>
                    <button id="redoBtn" class="icon-btn" title="Rehacer (Ctrl + Y / Ctrl + Shift + Z)">↷</button>
                </div>
            </header>

            <!-- Barra superior del editor: botonera de reproducción a la izquierda y reproductor a la derecha -->
            <div class="top-editor-section">
                <!-- Controles principales de reproducción, velocidad y reloj -->
                <div class="media-controls">
                    <button id="playBtn" class="media-btn" title="Reproducir (Espacio)">▶</button>
                    <button id="pauseBtn" class="media-btn" title="Pausar (Espacio)">❚❚</button>
                    <button id="replayBtn" class="media-btn" title="Volver a empezar">↻</button>
                    <!-- Botón multiplicador de velocidad (ej. x1.0); al hacer clic se convierte en input editable -->
                    <button id="speedBtn" class="speed-btn" title="Velocidad de reproducción">x1.0</button>
                    <input type="text" id="speedInput" class="speed-input hidden" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6">
                    <!-- Indicador de tiempo actual / duración total del proyecto -->
                    <span id="timeDisplay" class="time-display">00:00.0 / 00:00.0</span>
                </div>

                <!-- Contenedor del reproductor / vista previa de video -->
                <div class="video-player-container" id="videoPlayerContainer">
                    <!-- Botón de tres puntos para elegir relación de aspecto (16:9, 9:16, 1:1, 4:3, 21:9, etc.) -->
                    <button id="aspectMenuBtn" class="aspect-menu-btn" title="Elegir formato de pantalla">⋮</button>
                    <!-- Lienzo HTML5 (Canvas) donde se dibujan y mezclan en tiempo real todas las capas visuales -->
                    <canvas id="previewCanvas" width="640" height="360"></canvas>

                    <!-- Superposición de controles dentro del reproductor (volumen, pantalla completa y barra seek) -->
                    <div class="video-controls-overlay">
                        <!-- Barra de progreso interactiva (visible únicamente en modo pantalla completa) -->
                        <div class="fs-seek fs-only" id="fsSeek" title="Ir a un momento exacto">
                            <div class="fs-seek-track">
                                <div class="fs-seek-fill" id="fsSeekFill"></div>
                                <div class="fs-seek-thumb" id="fsSeekThumb"></div>
                            </div>
                            <!-- Miniatura flotante con previsualización del fotograma al pasar el cursor por la barra -->
                            <div class="fs-seek-tip" id="fsSeekTip">
                                <canvas id="fsSeekCanvas" width="160" height="90"></canvas>
                                <div id="fsSeekTipTime" class="fs-seek-tip-time">00:00.0</div>
                            </div>
                        </div>
                        <div class="controls-row">
                            <div class="controls-left">
                                <!-- Botón Play/Pausa exclusivo de pantalla completa -->
                                <button id="fsPlayBtn" class="video-btn fs-only" title="Reproducir / Pausar">▶</button>
                                <!-- Control maestro de silencio y deslizador de volumen general -->
                                <div class="volume-control-wrapper">
                                    <button id="volumeBtn" class="video-btn" title="Volumen">
                                        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                        </svg>
                                    </button>
                                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                                </div>
                                <!-- Reloj de tiempo en pantalla completa -->
                                <span id="fsTime" class="fs-time fs-only">00:00.0 / 00:00.0</span>
                            </div>
                            <!-- Botón para entrar o salir de pantalla completa (donde también se transforman capas) -->
                            <button id="fullscreenBtn" class="video-btn" title="Pantalla Completa">
                                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================================================================
             ÁREA DE TRABAJO INFERIOR: Línea de Tiempo Multipista y Acciones
             ================================================================== -->
        <div class="project-workspace">
            <!-- Añade una nueva pista/fila vacía en la línea de tiempo -->
            <button id="addRowBtn" class="add-row-btn">+ Nueva fila</button>
            <div class="workspace-content">
                <!-- Contenedor principal de la línea de tiempo -->
                <div class="timeline" id="timeline">
                    <!-- Regla superior con marcas de segundos (clic/arrastre mueve el cabezal) -->
                    <div class="ruler" id="ruler"></div>
                    <!-- Contenedor dinámico de filas/pistas donde se alojan los clips -->
                    <div id="rowsContainer" class="rows-container" style="width: 500px;"></div>
                    <!-- Línea vertical roja que marca el segundo exacto de reproducción -->
                    <div class="playhead" id="playhead"></div>
                </div>
                <!-- Botones principales de entrada y salida de contenido -->
                <div class="data-transfer-controls">
                    <!-- Abre el explorador de archivos para importar videos, imágenes o audios -->
                    <button id="importBtn" class="action-btn">Importar</button>
                    <!-- Crea un clip de texto editable en una nueva pista superior -->
                    <button id="addTextBtn" class="action-btn" title="Insertar un texto en el video">Insertar texto</button>
                    <!-- Inicia el flujo de renderizado y descarga del video final -->
                    <button id="exportBtn" class="action-btn">Exportar</button>
                </div>
                <!-- Input oculto activado por #importBtn para seleccionar archivos multimedia locales -->
                <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple hidden>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         SECCIÓN 3: MODALES DE EXPORTACIÓN
         1. #exportQualityModal: Permite elegir la resolución (144p a 1080p)
            y tasa de bits (bitrate) antes de grabar.
         2. #exportModal: Pantalla bloqueante que muestra el progreso en tiempo real.
         ====================================================================== -->
    <div id="exportQualityModal" class="quality-modal hidden">
        <div class="quality-modal-box">
            <h3>Calidad de exportación</h3>
            <p class="quality-modal-sub">Elige la resolución vertical del video</p>
            <div class="quality-options">
                <button type="button" class="quality-option-btn" data-height="144" data-bitrate="500000">144p</button>
                <button type="button" class="quality-option-btn" data-height="240" data-bitrate="1000000">240p</button>
                <button type="button" class="quality-option-btn" data-height="480" data-bitrate="2500000">480p</button>
                <button type="button" class="quality-option-btn" data-height="720" data-bitrate="6000000">720p</button>
                <button type="button" class="quality-option-btn" data-height="1080" data-bitrate="12000000">1080p</button>
            </div>
            <button type="button" id="cancelQualityBtn" class="quality-cancel-btn">Cancelar</button>
        </div>
    </div>

    <!-- Modal de progreso durante la grabación/exportación del archivo final -->
    <div id="exportModal" class="hidden" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white;">
        <h2>Exportando video...</h2>
        <p id="exportProgress">0%</p>
    </div>

    <!-- Script principal que da vida a toda la aplicación -->
    <script src="main.js"></script>
</body>
</html>
