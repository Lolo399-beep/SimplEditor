<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- VISTA PRINCIPAL (Menú de Proyectos) -->
    <div id="mainView">
        <header class="main-header">
            <h1>Proyectos</h1>

            <!-- BARRA Y MENÚ DE BÚSQUEDA CONCEPTUAL -->
            <div class="search-container">
                <div class="search-bar">
                    <span class="search-icon">⌕</span>
                    <input type="text" id="searchInput" placeholder="Buscar" autocomplete="off" spellcheck="false">
                </div> 
                <!-- Cuadrado gris de resultados -->
                <div id="searchResults" class="search-results-dropdown hidden"></div>
            </div>
        </header>

        <div class="grid" id="projectGrid">
            <!-- Tarjeta para crear nuevo proyecto -->
            <div class="project-card">
                <div class="project-box" id="addProjectBtn" title="Crear nuevo proyecto">
                    <span class="plus-sign">+</span>
                </div>
                <input type="text" class="project-name" value="Nuevo proyecto" readonly />
            </div>
        </div>
    </div>

    <!-- VISTA EXCLUSIVA DEL PROYECTO (editor) -->
    <div id="projectDetailView" class="hidden">
        <div class="sticky-top" id="stickyTop">
            <header class="project-header">
                <button id="backBtn" class="back-btn">&lt;- Volver</button>
                <h2 id="currentProjectTitle">Nombre del Proyecto</h2>

                <div class="history-controls">
                    <button id="undoBtn" class="icon-btn" title="Deshacer (Ctrl + Z)">↶</button>
                    <button id="redoBtn" class="icon-btn" title="Rehacer (Ctrl + Y / Ctrl + Shift + Z)">↷</button>
                </div>
            </header>

            <div class="top-editor-section">
                <div class="media-controls">
                    <button id="playBtn" class="media-btn" title="Reproducir (Espacio)">▶</button>
                    <button id="pauseBtn" class="media-btn" title="Pausar (Espacio)">❚❚</button>
                    <button id="replayBtn" class="media-btn" title="Volver a empezar">↻</button>
                    <button id="speedBtn" class="speed-btn" title="Velocidad de reproducción">x1.0</button>
                    <input type="text" id="speedInput" class="speed-input hidden" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6">
                    <span id="timeDisplay" class="time-display">00:00.0 / 00:00.0</span>
                </div>

                <div class="video-player-container" id="videoPlayerContainer">
                    <button id="aspectMenuBtn" class="aspect-menu-btn" title="Elegir formato de pantalla">⋮</button>
                    <canvas id="previewCanvas" width="640" height="360"></canvas>

                    <div class="video-controls-overlay">
                        <div class="fs-seek fs-only" id="fsSeek" title="Ir a un momento exacto">
                            <div class="fs-seek-track">
                                <div class="fs-seek-fill" id="fsSeekFill"></div>
                                <div class="fs-seek-thumb" id="fsSeekThumb"></div>
                            </div>
                            <div class="fs-seek-tip" id="fsSeekTip">
                                <canvas id="fsSeekCanvas" width="160" height="90"></canvas>
                                <div id="fsSeekTipTime" class="fs-seek-tip-time">00:00.0</div>
                            </div>
                        </div>
                        <div class="controls-row">
                            <div class="controls-left">
                                <button id="fsPlayBtn" class="video-btn fs-only" title="Reproducir / Pausar">▶</button>
                                <div class="volume-control-wrapper">
                                    <button id="volumeBtn" class="video-btn" title="Volumen">
                                        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                        </svg>
                                    </button>
                                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                                </div>
                                <span id="fsTime" class="fs-time fs-only">00:00.0 / 00:00.0</span>
                            </div>
                            <button id="fullscreenBtn" class="video-btn" title="Pantalla Completa">
                                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="project-workspace">
            <button id="addRowBtn" class="add-row-btn">+ Nueva fila</button>
            <div class="workspace-content">
                <div class="timeline" id="timeline">
                    <div class="ruler" id="ruler"></div>
                    <div id="rowsContainer" class="rows-container" style="width: 500px;"></div>
                    <div class="playhead" id="playhead"></div>
                </div>
                <div class="data-transfer-controls">
                    <button id="importBtn" class="action-btn">Importar</button>
                    <button id="addTextBtn" class="action-btn" title="Insertar un texto en el video">Insertar texto</button>
                    <button id="exportBtn" class="action-btn">Exportar</button>
                </div>
                <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple hidden>
            </div>
        </div>
    </div>

        <!-- Modal de selección de calidad antes de exportar -->
    <div id="exportQualityModal" class="quality-modal hidden">
        <div class="quality-modal-box">
            <h3>Calidad de exportación</h3>
            <p class="quality-modal-sub">Elige la resolución vertical del video</p>
            <div class="quality-options">
                <button type="button" class="quality-option-btn" data-height="144" data-bitrate="500000">144p</button>
                <button type="button" class="quality-option-btn" data-height="240" data-bitrate="1000000">240p</button>
                <button type="button" class="quality-option-btn" data-height="480" data-bitrate="2500000">480p</button>
                <button type="button" class="quality-option-btn" data-height="720" data-bitrate="6000000">720p</button>
                <button type="button" class="quality-option-btn" data-height="1080" data-bitrate="12000000">1080p</button>
            </div>
            <button type="button" id="cancelQualityBtn" class="quality-cancel-btn">Cancelar</button>
        </div>
    </div>

    <div id="exportModal" class="hidden" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white;">
        <h2>Exportando video...</h2>
        <p id="exportProgress">0%</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
